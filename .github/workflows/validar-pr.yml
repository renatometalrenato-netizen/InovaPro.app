name: Validar Pull Request

on:
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Tipos, build e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit

      - name: Verificar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Construir aplicativo para GitHub Pages
        run: npm run build
        env:
          VITE_APP_URL: https://renatometalrenato-netizen.github.io/InovaPro.app/
          VITE_SUPABASE_URL: https://tygksrzhqqjsltmycvxp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8LFlbAZtz6pvbChWFWR8zw_PX4HrIdp

      - name: Conferir que o build gerou saida
        run: test -f dist/index.html

      - name: Construir aplicativo para Vercel
        run: npm run build:vercel
        env:
          VITE_APP_URL: https://example.vercel.app/
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test

      - name: Conferir build Vercel
        run: test -f dist/index.html

      - name: Barrar segredos e artefatos versionados
        run: bash .github/scripts/verificar-segredos.sh

name: Publicar InovaPro App

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir aplicativo
        run: npm run build
        env:
          VITE_APP_URL: https://renatometalrenato-netizen.github.io/InovaPro.app/
          VITE_SUPABASE_URL: https://tygksrzhqqjsltmycvxp.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8LFlbAZtz6pvbChWFWR8zw_PX4HrIdp

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Enviar aplicativo
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publicar
        uses: actions/deploy-pages@v5
